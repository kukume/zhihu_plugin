name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npx @vscode/vsce package --out zhihu.vsix

      - name: Publish VSIX to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="$(cat <<'EOF'
          每次推送覆盖构建，请下载 zhihu.vsix 后在 VS Code / Cursor 中「从 VSIX 安装」。

          使用前需先部署 https://github.com/kukume/zhihu，并在设置里配置 zhihu.baseUrl。
          EOF
          )"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest zhihu.vsix --clobber
            gh release edit latest --title "zhihu" --notes "$NOTES"
          else
            gh release create latest zhihu.vsix --title "zhihu" --notes "$NOTES" --latest
          fi
